exercises:
  - id: first-receipt
    concept: screens
    type: onec-lab
    difficulty: 2
    mode: hybrid
    prompt: 'Заведите контрагента «ООО Ромашка», проведите поступление 10 единиц «Бумага А4» на склад «Основной» и откройте отчёт остатков.'
    hints:
      - 'Разделы сверху. Пока не открыт нужный раздел, его списка на экране нет.'
      - 'Черновик по кнопке «Записать» остаток не меняет. Остаток появляется после проведения.'
      - 'В шапке нужны контрагент и склад из справочников, в таблице - номенклатура и количество из текста задания.'
    seed:
      today: '2026-03-20'
      products:
        - name: Бумага А4
      warehouses:
        - name: Основной
    steps:
      - id: open-catalogs
        title: Откройте «Справочники»
        focus: sections
        coach: 'Верхняя полоса переключает область. Контрагента ищут не в документах.'
        expect:
          - { kind: section, equals: catalogs }
      - id: open-counterparties
        title: Откройте список контрагентов
        focus: catalog-nav
        coach: 'Команда раздела открывает список. Контрагент - тот, от кого пришёл товар.'
        expect:
          - { kind: list, object: counterparties }
      - id: create-counterparty
        title: Создайте «ООО Ромашка»
        focus: counterparty-create
        coach: '«Создать», наименование, «Записать и закрыть». В документ попадёт именно это имя.'
        expect:
          - { kind: catalog-item, catalog: counterparties, name: ООО Ромашка }
      - id: open-documents
        title: Откройте «Документы»
        focus: sections
        coach: 'Поступление - это событие, не справочник. Ему нужен свой раздел.'
        expect:
          - { kind: section, equals: documents }
      - id: open-receipts
        title: Откройте «Поступление товаров»
        focus: document-nav
        coach: 'Список документов показывает номер, дату и состояние: записан или проведен.'
        expect:
          - { kind: list, object: receipts }
      - id: new-receipt
        title: Создайте документ
        focus: receipt-create
        coach: '«Создать» открывает форму. Номер и дата уже стоят, шапка пустая.'
        expect:
          - { kind: form, equals: receipt }
      - id: post-receipt
        title: Проведите 10 единиц бумаги
        focus: post
        coach: 'Контрагент «ООО Ромашка», склад «Основной», строка «Бумага А4» количеством 10. Потом «Провести», не «Записать».'
        expect:
          - kind: document-posted
            counterparty: ООО Ромашка
            warehouse: Основной
            lines:
              - { product: Бумага А4, qty: 10 }
      - id: open-balances
        title: Откройте остатки
        focus: report-nav
        coach: 'Раздел «Отчёты», команда «Остатки товаров». На «Основном» должно лежать 10 единиц бумаги.'
        expect:
          - { kind: list, object: balances }
          - { kind: balance, product: Бумага А4, warehouse: Основной, qty: 10 }
    goal:
      - kind: document-posted
        counterparty: ООО Ромашка
        warehouse: Основной
        lines:
          - { product: Бумага А4, qty: 10 }
      - { kind: balance, product: Бумага А4, warehouse: Основной, qty: 10 }
    solution:
      - { op: open-section, section: catalogs }
      - { op: open-list, object: counterparties }
      - { op: create-catalog, catalog: counterparties, name: ООО Ромашка }
      - { op: open-section, section: documents }
      - { op: open-list, object: receipts }
      - { op: open-new-receipt }
      - { op: set-receipt-field, field: counterparty, value: ООО Ромашка }
      - { op: set-receipt-field, field: warehouse, value: Основной }
      - { op: add-receipt-line, product: Бумага А4, qty: 10, price: 100 }
      - { op: post-receipt }
      - { op: open-section, section: reports }
      - { op: open-list, object: balances }
    variants:
      - prompt: 'Заведите контрагента «ООО Василёк», проведите поступление 6 единиц «Бумага А4» на склад «Основной» и откройте отчёт остатков.'
