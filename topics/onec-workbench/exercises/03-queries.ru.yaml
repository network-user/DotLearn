exercises:
  - id: empty-report
    concept: queries
    type: onec-lab
    difficulty: 2
    mode: hybrid
    prompt: 'Поступление 10 единиц записано, но не проведено. Откройте остатки и убедитесь, что количество нулевое.'
    hints:
      - 'Список документов и регистр остатков смотрят на разные вещи.'
      - 'Пока нет проведения, строка «Бумага А4» в остатках не появляется.'
    seed:
      today: '2026-03-20'
      counterparties:
        - { name: ООО Ромашка }
      products:
        - { name: Бумага А4 }
      warehouses:
        - { name: Основной }
      receipts:
        - posted: false
          counterparty: ООО Ромашка
          warehouse: Основной
          lines:
            - { product: Бумага А4, qty: 10, price: 100 }
    steps:
      - id: open-report
        title: Откройте остатки
        focus: report-nav
        coach: 'Раздел «Отчёты». Пустая таблица здесь - правильный ответ, не поломка.'
        expect:
          - { kind: list, object: balances }
          - { kind: balance, product: Бумага А4, warehouse: Основной, qty: 0 }
    goal:
      - { kind: no-posted, doc: receipt }
      - { kind: balance, product: Бумага А4, warehouse: Основной, qty: 0 }
    solution:
      - { op: open-list, object: balances }
  - id: read-tree
    concept: queries
    type: onec-lab
    difficulty: 2
    mode: hybrid
    prompt: 'Откройте раздел «Конфигурация» и оставьте поступление непроведённым. Остаток нулевой.'
    hints:
      - 'Раздел на левой панели, рядом с отчётами.'
      - 'Дерево ничего не записывает. Проводить документ не нужно.'
    seed:
      today: '2026-03-20'
      counterparties:
        - { name: ООО Ромашка }
      products:
        - { name: Бумага А4 }
      warehouses:
        - { name: Основной }
      receipts:
        - posted: false
          counterparty: ООО Ромашка
          warehouse: Основной
          lines:
            - { product: Бумага А4, qty: 10, price: 100 }
    steps:
      - id: open-config
        title: Откройте «Конфигурация»
        focus: metadata
        coach: 'Там написано, какой документ пишет приход, а какой расход.'
        expect:
          - { kind: section, equals: config }
    goal:
      - { kind: no-posted, doc: receipt }
      - { kind: balance, product: Бумага А4, warehouse: Основной, qty: 0 }
    solution:
      - { op: open-section, section: config }
  - id: query-stock
    concept: queries
    type: onec-lab
    difficulty: 4
    mode: hybrid
    prompt: 'На «Основном» после поступления 10 и реализации 4 должно остаться 6. Выполните запрос остатка по этому складу и получите количество 6.'
    hints:
      - 'Таблица называется Остатки, не РегистрНакопления.'
      - 'ГДЕ Склад = "Основной". Поля: Номенклатура, Склад, Количество.'
      - 'Консоль есть и в отчёте остатков, и в разделе «Конфигурация».'
    seed:
      today: '2026-03-20'
      counterparties:
        - { name: ООО Ромашка }
      products:
        - { name: Бумага А4 }
      warehouses:
        - { name: Основной }
      receipts:
        - posted: true
          counterparty: ООО Ромашка
          warehouse: Основной
          lines:
            - { product: Бумага А4, qty: 10, price: 100 }
      sales:
        - posted: true
          counterparty: ООО Ромашка
          warehouse: Основной
          lines:
            - { product: Бумага А4, qty: 4, price: 100 }
    steps:
      - id: ask
        title: Выполните запрос
        focus: query
        coach: 'ВЫБРАТЬ Номенклатура, Склад, Количество ИЗ Остатки ГДЕ Склад = "Основной"'
        expect:
          - kind: query-result
            rows:
              - { Номенклатура: Бумага А4, Склад: Основной, Количество: 6 }
    goal:
      - kind: query-result
        rows:
          - { Номенклатура: Бумага А4, Склад: Основной, Количество: 6 }
    solution:
      - op: run-query
        text: 'ВЫБРАТЬ Номенклатура, Склад, Количество ИЗ Остатки ГДЕ Склад = "Основной"'
