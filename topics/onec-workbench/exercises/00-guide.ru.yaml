          - { op: open-list, object: products }
          - { op: open-list, object: counterparties }
          - { op: create-catalog, catalog: counterparties, name: ООО Василёк }
          - { op: open-section, section: documents }
          - { op: open-list, object: receipts }
          - { op: open-new-receipt }
          - { op: open-section, section: reports }
          - { op: open-list, object: balances }
  - id: add-warehouse
    concept: guide
    type: onec-lab
    difficulty: 2
    mode: hybrid
    prompt: 'Заведите склад «Магазин» и откройте журнал «Реализация товаров». Документы проводить не нужно.'
    hints:
      - 'Склады лежат в разделе «Справочники», на панели функций.'
      - '«Создать», наименование «Магазин», «Записать и закрыть».'
      - 'Журнал реализации открывается из раздела «Документы», не из поступления.'
    seed:
      today: '2026-03-20'
      products:
        - name: Бумага А4
      warehouses:
        - name: Основной
    steps:
      - id: open-catalogs
        title: Откройте «Справочники»
        focus: sections
        coach: 'Склад - справочник, как контрагент. Ищите его не в документах.'
        expect:
          - { kind: section, equals: catalogs }
      - id: open-warehouses
        title: Откройте список складов
        focus: catalog-nav
        coach: 'Панель функций раздела. «Основной» уже есть, второй склад заводится той же формой.'
        expect:
          - { kind: list, object: warehouses }
      - id: create-warehouse
        title: Создайте «Магазин»
        focus: counterparty-create
        coach: 'Кнопка «Создать» одна на все справочники. Наименование «Магазин», затем «Записать и закрыть».'
        expect:
          - { kind: catalog-item, catalog: warehouses, name: Магазин }
      - id: open-documents
        title: Откройте «Документы»
        focus: sections
        coach: 'Реализация - расходный документ. Её журнал в этом разделе, рядом с поступлением.'
        expect:
          - { kind: section, equals: documents }
      - id: open-sales
        title: Откройте «Реализация товаров»
        focus: sale-create
        coach: 'Команда открывает журнал. Создавать документ в этом задании не нужно: достаточно увидеть пустой список.'
        expect:
          - { kind: list, object: sales }
    goal:
      - { kind: catalog-item, catalog: warehouses, name: Магазин }
    solution:
      - { op: open-section, section: catalogs }
      - { op: open-list, object: warehouses }
      - { op: create-catalog, catalog: warehouses, name: Магазин }
      - { op: open-section, section: documents }
      - { op: open-list, object: sales }
  - id: mark-counterparty
    concept: guide
    type: onec-lab
    difficulty: 3
    mode: hybrid
    prompt: 'Откройте дерево конфигурации, заведите контрагента «ООО Лён», пометьте его на удаление и откройте остатки. Поступление не проводите.'
    hints:
      - 'Дерево только читается. Оно в разделе «Конфигурация» и ничего не записывает.'
      - 'Пометка ставится в списке контрагентов кнопкой «Пометить» на строке.'
      - 'Остатки лежат в разделе «Отчёты». Непроведённых документов там не видно.'
    seed:
      today: '2026-03-20'
      products:
        - name: Бумага А4
      warehouses:
        - name: Основной
    steps:
      - id: open-tree
        title: Откройте дерево объектов
        focus: metadata
        coach: 'Раздел «Конфигурация». Дерево показывает справочники, документы и регистр. Реквизиты отсюда не меняются.'
        expect:
          - { kind: section, equals: config }
      - id: open-counterparties
        title: Откройте контрагентов
        focus: catalog-nav
        coach: 'Вернитесь в «Справочники» и откройте список. Карточка создаётся отсюда, не из дерева.'
        expect:
          - { kind: list, object: counterparties }
      - id: create-counterparty
        title: Создайте «ООО Лён»
        focus: counterparty-create
        coach: '«Создать», наименование, «Записать и закрыть». Пока элемент не в списке, помечать нечего.'
        expect:
          - { kind: catalog-item, catalog: counterparties, name: ООО Лён }
      - id: mark-row
        title: Пометьте «ООО Лён» на удаление
        focus: mark
        coach: 'В строке списка кнопка «Пометить». Пометка перечёркивает элемент и не стирает его. Остатки она не двигает.'
        expect:
          - { kind: marked-catalog, catalog: counterparties, name: ООО Лён, marked: true }
      - id: open-balances
        title: Откройте остатки
        focus: report-nav
        coach: 'Раздел «Отчёты», «Остатки товаров». Бумаги на складе нет: документ вы не проводили, пометка тут ни при чём.'
        expect:
          - { kind: list, object: balances }
    goal:
      - { kind: marked-catalog, catalog: counterparties, name: ООО Лён, marked: true }
    solution:
      - { op: open-section, section: config }
      - { op: open-section, section: catalogs }
      - { op: open-list, object: counterparties }
      - { op: create-catalog, catalog: counterparties, name: ООО Лён }
      - { op: toggle-mark-catalog, catalog: counterparties, name: ООО Лён }
      - { op: open-section, section: reports }
      - { op: open-list, object: balances }
