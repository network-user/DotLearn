exercises:
  - id: window-guide
    concept: guide
    type: onec-lab
    difficulty: 1
    mode: hybrid
    prompt: 'Пройдите окно: заведите контрагента «ООО Ромашка», откройте новое поступление и затем отчёт остатков. Документ проводить не нужно.'
    hints:
      - 'Жёлтая панель слева переключает раздел. Команды текущего раздела лежат в соседней колонке.'
      - 'В списке контрагентов нажмите «Создать», введите наименование и «Записать и закрыть».'
      - 'Новое поступление открывается из журнала. Для зачёта его не проводят: дальше откройте остатки в разделе «Отчёты».'
    seed:
      today: '2026-03-20'
      products:
        - name: Бумага А4
      warehouses:
        - name: Основной
    steps:
      - id: open-catalogs
        title: Откройте раздел «Справочники»
        focus: sections
        coach: 'Жёлтая колонка слева - панель разделов. В центре сейчас начальная страница: плитки только открывают списки. «Справочники» держат то, что живёт долго и потом выбирается в документах.'
        expect:
          - { kind: section, equals: catalogs }
      - id: open-products
        title: Откройте список «Номенклатура»
        focus: catalog-nav
        coach: 'Узкая колонка рядом - панель функций текущего раздела. Чужие команды скрыты, пока не открыт их раздел. «Номенклатура» открывает форму списка.'
        expect:
          - { kind: list, object: products }
      - id: open-counterparties
        title: Откройте «Контрагенты»
        focus: catalog-nav
        coach: 'Та же панель, другая команда. У списка сверху командная панель, ниже таблица, внизу строка «Всего». Код элемента ставится сам.'
        expect:
          - { kind: list, object: counterparties }
      - id: create-counterparty
        title: Создайте «ООО Ромашка»
        focus: counterparty-create
        coach: '«Создать» открывает карточку. Нужно наименование, затем жёлтая «Записать и закрыть». В документ попадёт это имя, не код.'
        expect:
          - { kind: catalog-item, catalog: counterparties, name: ООО Ромашка }
      - id: open-documents
        title: Откройте раздел «Документы»
        focus: sections
        coach: 'Документ фиксирует событие: кто, когда и что произошло. Поступление и реализация лежат здесь, не среди справочников.'
        expect:
          - { kind: section, equals: documents }
      - id: open-receipts
        title: Откройте «Поступление товаров»
        focus: document-nav
        coach: 'Это журнал. В строке номер, дата, контрагент и состояние. «Записан» ещё не двигает склад. «Проведен» уже записал движения.'
        expect:
          - { kind: list, object: receipts }
      - id: new-receipt
        title: Создайте поступление
        focus: receipt-create
        coach: '«Создать» открывает форму. Номер и дата уже стоят. В шапке контрагент и склад, на закладке «Товары» строки. «Записать» оставляет черновик, «Провести» пишет приход. Сейчас проводить не нужно.'
        expect:
          - { kind: form, equals: receipt }
      - id: open-balances
        title: Откройте остатки
        focus: report-nav
        coach: 'Раздел «Отчёты», команда «Остатки товаров». Отчёт читает только проведённые документы. Пустая таблица значит, что проведения ещё не было. Его разберёт следующий урок.'
        expect:
          - { kind: list, object: balances }
    goal:
      - { kind: catalog-item, catalog: counterparties, name: ООО Ромашка }
    solution:
      - { op: open-section, section: catalogs }
      - { op: open-list, object: products }
      - { op: open-list, object: counterparties }
      - { op: create-catalog, catalog: counterparties, name: ООО Ромашка }
      - { op: open-section, section: documents }
      - { op: open-list, object: receipts }
      - { op: open-new-receipt }
      - { op: open-section, section: reports }
      - { op: open-list, object: balances }
    variants:
      - prompt: 'Пройдите окно: заведите контрагента «ООО Василёк», откройте новое поступление и затем отчёт остатков. Документ проводить не нужно.'
