exercises:
  - id: sell-four
    concept: stock
    type: onec-lab
    difficulty: 2
    mode: hybrid
    prompt: 'На «Основном» уже 10 единиц «Бумага А4». Проведите реализацию 4 единиц контрагенту «ООО Ромашка» с этого склада.'
    hints:
      - 'Реализация живёт в разделе «Документы», не в поступлении.'
      - 'После проведения остаток должен стать 6, не ноль.'
    seed:
      today: '2026-03-20'
      counterparties:
        - { name: ООО Ромашка }
      products:
        - { name: Бумага А4 }
      warehouses:
        - { name: Основной }
      receipts:
        - posted: true
          counterparty: ООО Ромашка
          warehouse: Основной
          lines:
            - { product: Бумага А4, qty: 10, price: 100 }
    steps:
      - id: open-sale
        title: Откройте новую реализацию
        focus: sale-create
        coach: 'Команда «Реализация товаров», затем «Создать».'
        expect:
          - { kind: form, equals: sale }
      - id: posted-sale
        title: Проведите 4 единицы
        focus: post
        coach: 'Контрагент и склад из текста, строка количеством 4, кнопка «Провести».'
        expect:
          - kind: document-posted
            doc: sale
            posted: true
            counterparty: ООО Ромашка
            warehouse: Основной
            lines:
              - { product: Бумага А4, qty: 4 }
    goal:
      - kind: document-posted
        doc: sale
        posted: true
        counterparty: ООО Ромашка
        warehouse: Основной
        lines:
          - { product: Бумага А4, qty: 4 }
      - { kind: balance, product: Бумага А4, warehouse: Основной, qty: 6 }
    solution:
      - { op: open-new-sale }
      - { op: set-sale-field, field: counterparty, value: ООО Ромашка }
      - { op: set-sale-field, field: warehouse, value: Основной }
      - { op: add-sale-line, product: Бумага А4, qty: 4, price: 100 }
      - { op: post-sale }
  - id: refuse-oversell
    concept: stock
    type: onec-lab
    difficulty: 3
    mode: hybrid
    prompt: 'На складе 10 единиц. Попробуйте провести реализацию 15. Документ не должен остаться проведённым, остаток остаётся 10.'
    hints:
      - 'Стенд отклоняет проведение и пишет, сколько есть в наличии.'
      - 'Записанный черновик на 15 остаток не портит. Проведённая реализация на 15 невозможна.'
    seed:
      today: '2026-03-20'
      counterparties:
        - { name: ООО Ромашка }
      products:
        - { name: Бумага А4 }
      warehouses:
        - { name: Основной }
      receipts:
        - posted: true
          counterparty: ООО Ромашка
          warehouse: Основной
          lines:
            - { product: Бумага А4, qty: 10, price: 100 }
    steps:
      - id: open-sale
        title: Откройте реализацию и соберите строку на 15
        focus: sale-create
        coach: 'Форма нужна. Кнопку «Провести» можно нажать: она ответит отказом и не запишет движение.'
        expect:
          - { kind: form, equals: sale }
    goal:
      - { kind: no-posted, doc: sale }
      - { kind: balance, product: Бумага А4, warehouse: Основной, qty: 10 }
    solution:
      - { op: open-new-sale }
      - { op: set-sale-field, field: counterparty, value: ООО Ромашка }
      - { op: set-sale-field, field: warehouse, value: Основной }
      - { op: add-sale-line, product: Бумага А4, qty: 15, price: 100 }
  - id: shrink-sale
    concept: stock
    type: onec-lab
    difficulty: 3
    mode: hybrid
    prompt: 'Реализация 000001 уже провела 4 единицы. Отмените проведение, оставьте в строке 2 и проведите снова. Остаток должен стать 8.'
    hints:
      - 'Пока документ проведён, строку не переписать кнопкой «Записать».'
      - 'Сначала «Отмена проведения», потом новая строка и «Провести».'
    seed:
      today: '2026-03-20'
      counterparties:
        - { name: ООО Ромашка }
      products:
        - { name: Бумага А4 }
      warehouses:
        - { name: Основной }
      receipts:
        - posted: true
          counterparty: ООО Ромашка
          warehouse: Основной
          lines:
            - { product: Бумага А4, qty: 10, price: 100 }
      sales:
        - posted: true
          counterparty: ООО Ромашка
          warehouse: Основной
          lines:
            - { product: Бумага А4, qty: 4, price: 100 }
    steps:
      - id: reopen
        title: Откройте реализацию 000001
        focus: document-nav
        coach: 'Список реализаций, номер в строке.'
        expect:
          - { kind: form, equals: sale }
      - id: repost
        title: Проведите 2 единицы
        focus: post
        coach: 'Снимите проведение, удалите старую строку, добавьте количество 2, проведите.'
        expect:
          - kind: document-posted
            doc: sale
            posted: true
            counterparty: ООО Ромашка
            warehouse: Основной
            lines:
              - { product: Бумага А4, qty: 2 }
    goal:
      - { kind: balance, product: Бумага А4, warehouse: Основной, qty: 8 }
    solution:
      - { op: open-sale, id: sale-1 }
      - { op: unpost-sale }
      - { op: remove-sale-line, index: 0 }
      - { op: add-sale-line, product: Бумага А4, qty: 2, price: 100 }
      - { op: post-sale }
  - id: mark-keeps-stock
    concept: stock
    type: onec-lab
    difficulty: 3
    mode: hybrid
    prompt: 'Пометьте проведённое поступление 000001 на удаление. Остаток 10 не должен измениться, документ остаётся проведённым.'
    hints:
      - 'Пометка не равна отмене проведения.'
      - 'Кнопка на форме документа, не в справочнике.'
    seed:
      today: '2026-03-20'
      counterparties:
        - { name: ООО Ромашка }
      products:
        - { name: Бумага А4 }
      warehouses:
        - { name: Основной }
      receipts:
        - posted: true
          counterparty: ООО Ромашка
          warehouse: Основной
          lines:
            - { product: Бумага А4, qty: 10, price: 100 }
    steps:
      - id: open-doc
        title: Откройте поступление
        focus: document-nav
        coach: 'Список поступлений, номер 000001.'
        expect:
          - { kind: form, equals: receipt }
      - id: mark-it
        title: Поставьте пометку
        focus: mark
        coach: '«Пометить на удаление». Проведение не трогайте.'
        expect:
          - { kind: marked-document, doc: receipt, number: '000001', marked: true }
    goal:
      - { kind: marked-document, doc: receipt, number: '000001', marked: true }
      - kind: document-posted
        doc: receipt
        posted: true
        counterparty: ООО Ромашка
        warehouse: Основной
        lines:
          - { product: Бумага А4, qty: 10 }
      - { kind: balance, product: Бумага А4, warehouse: Основной, qty: 10 }
    solution:
      - { op: open-receipt, id: receipt-1 }
      - { op: toggle-mark-doc }
