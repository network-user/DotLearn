exercises:
  - id: flow-downtime
    concept: flow
    type: theory-quiz
    difficulty: 1
    prompt: Откуда в кейсе берётся большая часть простоя линии?
    choices:
      - id: a
        text: Срывается заявка на сырьё, и линия остаётся без тары.
      - id: b
        text: Операторы устают к середине смены и останавливают выпуск.
      - id: c
        text: Аптека принимает жалобы только бумажным письмом.
      - id: d
        text: Лаборатория на каждой партии берёт семь проб вместо трёх.
    correct:
      - a
    explanation: В тексте кейса 78% простоев связаны с отсутствием тары из-за сорванных заявок на сырьё.
  - id: flow-clocks
    concept: flow
    type: theory-quiz
    difficulty: 2
    prompt: Какие две паузы задаёт кейс до розлива и после старта смеси?
    choices:
      - id: a
        text: Тара отдыхает 180 минут, смесь живёт не дольше 360.
      - id: b
        text: Тара ждёт сутки, а смесь можно держать сколько угодно.
      - id: c
        text: Обе паузы равны 180 минутам и считаются от розлива.
      - id: d
        text: Окисление наступает через 60 минут после отбора проб.
    correct:
      - a
    explanation: 180 минут тара лежит после выпуска. 360 минут смесь стоит в экструдере от момента «Начато».
  - id: flow-fill-gate
    concept: flow
    type: theory-quiz
    difficulty: 3
    prompt: Когда розлив партии вообще имеет право пройти?
    choices:
      - id: a
        text: Статус подтверждён, тара отлежалась, срок смеси не вышел.
      - id: b
        text: Достаточно трёх проб, даже если статус ещё «исследования».
      - id: c
        text: Розлив можно начать сразу после выпуска тары на линии.
      - id: d
        text: Аварийный слив заменяет розлив и сам кладёт препарат на склад.
    correct:
      - a
    explanation: "Нужны сразу три факта: «качество подтверждено», не меньше 180 минут от выпуска тары и не больше 360 минут
      от старта смеси."
