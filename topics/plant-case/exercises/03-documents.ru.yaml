exercises:
  - id: documents-balance
    concept: documents
    type: theory-quiz
    difficulty: 1
    prompt: Откуда отчёт берёт количество на складе?
    choices:
      - id: a
        text: Из проведённых движений, не из карточки документа.
      - id: b
        text: Из шапки документа, где число правят руками.
      - id: c
        text: Непроведённый черновик уже увеличивает склад сырья.
      - id: d
        text: Отчёт считает строки справочника номенклатуры.
    correct:
      - a
    explanation: Регистр суммирует приход и расход только проведённых документов. Запись без проведения остаток не меняет.
  - type: onec-designer
    mode: hybrid
    id: documents-receipt
    concept: documents
    difficulty: 2
    prompt: "Добавьте регистр Остатки с измерениями Номенклатура и Склад. Документ ПоступлениеСырья: ссылки Номенклатура и
      Склад, число Количество, приход в Остатки. Проведите 500 полимера на склад сырья."
    seed:
      today: 2024-06-03
      catalogs: &a2
        - name: Номенклатура
          fields:
            - name: Вид
              type: enum
              enumValues:
                - Сырьё
                - Тара
                - Препарат
        - name: Склады
          fields: []
        - name: Линии
          fields:
            - name: Цех
              type: enum
              enumValues:
                - Тара
                - Препарат
      items: &a4
        - catalog: Номенклатура
          name: Полимер
          values:
            Вид: Сырьё
        - catalog: Номенклатура
          name: Картридж
          values:
            Вид: Тара
        - catalog: Номенклатура
          name: Инсулин
          values:
            Вид: Препарат
        - catalog: Склады
          name: Склад сырья
          values: {}
        - catalog: Склады
          name: Склад тары
          values: {}
        - catalog: Склады
          name: Склад ГП
          values: {}
        - catalog: Линии
          name: Линия тары
          values:
            Цех: Тара
        - catalog: Линии
          name: Линия препарата
          values:
            Цех: Препарат
    steps:
      - id: register
        title: Регистр остатков
        coach: Кнопка «Регистр», затем два измерения на уже существующие справочники.
        focus: add-register
        expect:
          - kind: has-register
            name: Остатки
          - kind: has-dimension
            register: Остатки
            name: Номенклатура
          - kind: has-dimension
            register: Остатки
            name: Склад
      - id: receipt-doc
        title: Документ поступления
        coach: Документ ПоступлениеСырья с тремя реквизитами и приходом количества.
        focus: add-document
        expect:
          - kind: has-document
            name: ПоступлениеСырья
          - kind: has-movement
            document: ПоступлениеСырья
            register: Остатки
            direction: in
      - id: receipt-posted
        title: Проведите 500
        coach: "В предприятии создайте поступление: Полимер, Склад сырья, 500, и нажмите «Провести»."
        focus: post
        expect:
          - kind: posted
            document: ПоступлениеСырья
            values: &a1
              Номенклатура: Полимер
              Склад: Склад сырья
              Количество: 500
    goal:
      - kind: has-register
        name: Остатки
      - kind: has-document
        name: ПоступлениеСырья
      - kind: has-movement
        document: ПоступлениеСырья
        register: Остатки
        direction: in
      - kind: posted
        document: ПоступлениеСырья
        values: *a1
      - kind: balance
        register: Остатки
        dims:
          - name: Номенклатура
            value: Полимер
          - name: Склад
            value: Склад сырья
        qty: 500
    solution:
      - op: add-register
        name: Остатки
      - op: add-dimension
        register: Остатки
        name: Номенклатура
        catalog: Номенклатура
      - op: add-dimension
        register: Остатки
        name: Склад
        catalog: Склады
      - op: add-document
        name: ПоступлениеСырья
      - op: add-field
        object: ПоступлениеСырья
        name: Номенклатура
        type: ref
        ref: Номенклатура
      - op: add-field
        object: ПоступлениеСырья
        name: Склад
        type: ref
        ref: Склады
      - op: add-field
        object: ПоступлениеСырья
        name: Количество
        type: number
      - op: add-movement
        document: ПоступлениеСырья
        register: Остатки
        direction: in
        qtyField: Количество
        dimensions: &a3
          - dimension: Номенклатура
            field: Номенклатура
          - dimension: Склад
            field: Склад
      - op: open-mode
        mode: enterprise
      - op: open-object
        name: ПоступлениеСырья
      - op: open-new
        object: ПоступлениеСырья
      - op: set-value
        field: Номенклатура
        value: Полимер
      - op: set-value
        field: Склад
        value: Склад сырья
      - op: set-value
        field: Количество
        value: 500
      - op: post
    hints:
      - Измерение Склад ссылается на справочник Склады, его нужно создать раньше измерения.
      - Приход берёт количество из числового реквизита и раскладывает измерения по ссылкам документа.
  - type: onec-designer
    mode: hybrid
    id: documents-rules
    concept: documents
    difficulty: 4
    prompt: "Поступление и регистр уже есть. Добавьте ЗаданиеНаТару (приход тары и расход сырья по Объёму),
      ЗаданиеНаПрепарат (только расход сырья), КонтрольКачества без движений с правилом проб РФ=3 и GMP=7, Розлив
      (расход тары и приход препарата) с тремя условиями: статус «качество подтверждено», тара не раньше 180 минут,
      смесь не позже 360 минут. Затем АварийныйСлив без движений, не раньше 360 минут от старта смеси. Имена реквизитов:
      у тары ВидТары, НомерПартии, Объём, Выпущена, СкладТары, Сырьё, СкладСырья, Линия, Стандарт. У препарата Препарат,
      Сырьё, СкладСырья, НомерПартии, Стандарт, Объём, Линия, Начато. У контроля НомерПартии, Стандарт, ЧислоПроб,
      Статус. У розлива НомерПартии, НомерПартииТары, Препарат, Тара, СкладТары, СкладГП, Количество, Момент. У слива
      НомерПартии, Препарат, Момент."
    seed:
      today: 2024-06-03
      catalogs: *a2
      registers:
        - name: Остатки
          dimensions:
            - name: Номенклатура
              catalog: Номенклатура
            - name: Склад
              catalog: Склады
      documents:
        - name: ПоступлениеСырья
          fields:
            - name: Номенклатура
              type: ref
              ref: Номенклатура
            - name: Склад
              type: ref
              ref: Склады
            - name: Количество
              type: number
          movements:
            - register: Остатки
              direction: in
              qtyField: Количество
              dimensions: *a3
          guards: []
      items: *a4
      docs:
        - document: ПоступлениеСырья
          posted: true
          values: *a1
    steps:
      - id: tara-doc
        title: Задание на тару
        coach: Приход ВидТары на СкладТары и расход Сырьё со СкладСырья. Оба движения берут Объём.
        focus: add-movement
        expect:
          - kind: has-document
            name: ЗаданиеНаТару
          - kind: has-movement
            document: ЗаданиеНаТару
            register: Остатки
            direction: in
          - kind: has-movement
            document: ЗаданиеНаТару
            register: Остатки
            direction: out
      - id: drug-doc
        title: Задание на препарат
        coach: Только расход сырья. Готовый инсулин этот документ не приходует.
        focus: add-movement
        expect:
          - kind: has-document
            name: ЗаданиеНаПрепарат
          - kind: has-movement
            document: ЗаданиеНаПрепарат
            register: Остатки
            direction: out
      - id: qc-doc
        title: Контроль и пробы
        coach: "Движений нет. Правило: РФ это 3 пробы, GMP это 7."
        focus: add-guard
        expect:
          - kind: has-document
            name: КонтрольКачества
          - kind: has-guard
            document: КонтрольКачества
            guard: probe-count
            rules:
              - standard: РФ
                count: 3
              - standard: GMP
                count: 7
      - id: fill-doc
        title: Три условия розлива
        coach: Сначала сам розлив с расходом тары и приходом препарата. Условия добавляйте, когда контроль, тара и препарат уже
          есть.
        focus: add-guard
        expect:
          - kind: has-document
            name: Розлив
          - kind: has-guard
            document: Розлив
            guard: linked-status
          - kind: has-guard
            document: Розлив
            guard: linked-min-minutes
            minutes: 180
          - kind: has-guard
            document: Розлив
            guard: linked-max-minutes
            minutes: 360
      - id: drain-doc
        title: Аварийный слив
        coach: Без движений. Не раньше 360 минут от поля Начато задания на препарат.
        focus: add-guard
        expect:
          - kind: has-document
            name: АварийныйСлив
          - kind: has-guard
            document: АварийныйСлив
            guard: linked-min-minutes
            minutes: 360
    goal:
      - kind: has-document
        name: ЗаданиеНаТару
      - kind: has-document
        name: ЗаданиеНаПрепарат
      - kind: has-document
        name: КонтрольКачества
      - kind: has-document
        name: Розлив
      - kind: has-document
        name: АварийныйСлив
      - kind: has-movement
        document: ЗаданиеНаТару
        register: Остатки
        direction: in
      - kind: has-movement
        document: ЗаданиеНаТару
        register: Остатки
        direction: out
      - kind: has-movement
        document: ЗаданиеНаПрепарат
        register: Остатки
        direction: out
      - kind: has-movement
        document: Розлив
        register: Остатки
        direction: out
      - kind: has-movement
        document: Розлив
        register: Остатки
        direction: in
      - kind: has-guard
        document: КонтрольКачества
        guard: probe-count
        rules:
          - standard: РФ
            count: 3
          - standard: GMP
            count: 7
      - kind: has-guard
        document: Розлив
        guard: linked-status
      - kind: has-guard
        document: Розлив
        guard: linked-min-minutes
        minutes: 180
      - kind: has-guard
        document: Розлив
        guard: linked-max-minutes
        minutes: 360
      - kind: has-guard
        document: АварийныйСлив
        guard: linked-min-minutes
        minutes: 360
    solution:
      - op: add-document
        name: ЗаданиеНаТару
      - op: add-field
        object: ЗаданиеНаТару
        name: ВидТары
        type: ref
        ref: Номенклатура
      - op: add-field
        object: ЗаданиеНаТару
        name: НомерПартии
        type: string
      - op: add-field
        object: ЗаданиеНаТару
        name: Объём
        type: number
      - op: add-field
        object: ЗаданиеНаТару
        name: Выпущена
        type: datetime
      - op: add-field
        object: ЗаданиеНаТару
        name: СкладТары
        type: ref
        ref: Склады
      - op: add-field
        object: ЗаданиеНаТару
        name: Сырьё
        type: ref
        ref: Номенклатура
      - op: add-field
        object: ЗаданиеНаТару
        name: СкладСырья
        type: ref
        ref: Склады
      - op: add-field
        object: ЗаданиеНаТару
        name: Линия
        type: ref
        ref: Линии
      - op: add-field
        object: ЗаданиеНаТару
        name: Стандарт
        type: enum
        enumValues:
          - РФ
          - GMP
      - op: add-movement
        document: ЗаданиеНаТару
        register: Остатки
        direction: in
        qtyField: Объём
        dimensions:
          - dimension: Номенклатура
            field: ВидТары
          - dimension: Склад
            field: СкладТары
      - op: add-movement
        document: ЗаданиеНаТару
        register: Остатки
        direction: out
        qtyField: Объём
        dimensions:
          - dimension: Номенклатура
            field: Сырьё
          - dimension: Склад
            field: СкладСырья
      - op: add-document
        name: ЗаданиеНаПрепарат
      - op: add-field
        object: ЗаданиеНаПрепарат
        name: Препарат
        type: ref
        ref: Номенклатура
      - op: add-field
        object: ЗаданиеНаПрепарат
        name: Сырьё
        type: ref
        ref: Номенклатура
      - op: add-field
        object: ЗаданиеНаПрепарат
        name: СкладСырья
        type: ref
        ref: Склады
      - op: add-field
        object: ЗаданиеНаПрепарат
        name: НомерПартии
        type: string
      - op: add-field
        object: ЗаданиеНаПрепарат
        name: Стандарт
        type: enum
        enumValues:
          - РФ
          - GMP
      - op: add-field
        object: ЗаданиеНаПрепарат
        name: Объём
        type: number
      - op: add-field
        object: ЗаданиеНаПрепарат
        name: Линия
        type: ref
        ref: Линии
      - op: add-field
        object: ЗаданиеНаПрепарат
        name: Начато
        type: datetime
      - op: add-movement
        document: ЗаданиеНаПрепарат
        register: Остатки
        direction: out
        qtyField: Объём
        dimensions:
          - dimension: Номенклатура
            field: Сырьё
          - dimension: Склад
            field: СкладСырья
      - op: add-document
        name: КонтрольКачества
      - op: add-field
        object: КонтрольКачества
        name: НомерПартии
        type: string
      - op: add-field
        object: КонтрольКачества
        name: Стандарт
        type: enum
        enumValues:
          - РФ
          - GMP
      - op: add-field
        object: КонтрольКачества
        name: ЧислоПроб
        type: number
      - op: add-field
        object: КонтрольКачества
        name: Статус
        type: enum
        enumValues:
          - исследования
          - качество подтверждено
          - необходим дозабор
          - брак
      - op: add-guard
        document: КонтрольКачества
        guard:
          kind: probe-count
          standardField: Стандарт
          countField: ЧислоПроб
          rules:
            - standard: РФ
              count: 3
            - standard: GMP
              count: 7
          message: Число проб не совпало со стандартом
      - op: add-document
        name: Розлив
      - op: add-field
        object: Розлив
        name: НомерПартии
        type: string
      - op: add-field
        object: Розлив
        name: НомерПартииТары
        type: string
      - op: add-field
        object: Розлив
        name: Препарат
        type: ref
        ref: Номенклатура
      - op: add-field
        object: Розлив
        name: Тара
        type: ref
        ref: Номенклатура
      - op: add-field
        object: Розлив
        name: СкладТары
        type: ref
        ref: Склады
      - op: add-field
        object: Розлив
        name: СкладГП
        type: ref
        ref: Склады
      - op: add-field
        object: Розлив
        name: Количество
        type: number
      - op: add-field
        object: Розлив
        name: Момент
        type: datetime
      - op: add-movement
        document: Розлив
        register: Остатки
        direction: out
        qtyField: Количество
        dimensions:
          - dimension: Номенклатура
            field: Тара
          - dimension: Склад
            field: СкладТары
      - op: add-movement
        document: Розлив
        register: Остатки
        direction: in
        qtyField: Количество
        dimensions:
          - dimension: Номенклатура
            field: Препарат
          - dimension: Склад
            field: СкладГП
      - op: add-guard
        document: Розлив
        guard:
          kind: linked-status
          linkField: НомерПартии
          document: КонтрольКачества
          keyField: НомерПартии
          statusField: Статус
          value: качество подтверждено
          message: Розлив только после подтверждения качества
      - op: add-guard
        document: Розлив
        guard:
          kind: linked-min-minutes
          linkField: НомерПартииТары
          document: ЗаданиеНаТару
          keyField: НомерПартии
          timeField: Выпущена
          nowField: Момент
          minutes: 180
          message: Тара ещё не отлежалась
      - op: add-guard
        document: Розлив
        guard:
          kind: linked-max-minutes
          linkField: НомерПартии
          document: ЗаданиеНаПрепарат
          keyField: НомерПартии
          timeField: Начато
          nowField: Момент
          minutes: 360
          message: Препарат окислился, нужен аварийный слив
      - op: add-document
        name: АварийныйСлив
      - op: add-field
        object: АварийныйСлив
        name: НомерПартии
        type: string
      - op: add-field
        object: АварийныйСлив
        name: Препарат
        type: ref
        ref: Номенклатура
      - op: add-field
        object: АварийныйСлив
        name: Момент
        type: datetime
      - op: add-guard
        document: АварийныйСлив
        guard:
          kind: linked-min-minutes
          linkField: НомерПартии
          document: ЗаданиеНаПрепарат
          keyField: НомерПартии
          timeField: Начато
          nowField: Момент
          minutes: 360
          message: До окисления слив не нужен
    hints:
      - "Сначала документы, на которые ссылаются другие: тара, препарат и контроль. Розлив и слив идут после них."
      - Число проб вешается на контроль. Три срока розлива и слива смотрят на даты чужих документов по номеру партии.
