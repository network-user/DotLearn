exercises:
  - id: batch-window
    concept: batch
    type: theory-quiz
    difficulty: 1
    prompt: Какая партия в этот день доходит до склада готовой продукции?
    choices:
      - id: a
        text: Подтверждённое качество, отдых тары и живая смесь.
      - id: b
        text: Розлив сразу после смешивания, пробы можно добрать потом.
      - id: c
        text: Семь проб нужны всегда, стандарт партии ни на что не влияет.
      - id: d
        text: Аварийный слив можно провести в любую минуту после старта.
    correct:
      - a
    explanation: На склад ГП препарат кладёт только розлив внутри обеих пауз и после статуса «качество подтверждено».
  - type: onec-designer
    mode: hybrid
    id: batch-tara
    concept: batch
    difficulty: 2
    prompt: "Конфигурация и 500 полимера уже на месте. Проведите задание на тару T-14: 100 картриджей в 08:00, линия тары,
      стандарт РФ, сырьё со склада сырья. Розлив не трогайте."
    seed: &a2
      today: 2024-06-03
      catalogs:
        - name: Номенклатура
          fields:
            - name: Вид
              type: enum
              enumValues:
                - Сырьё
                - Тара
                - Препарат
        - name: Склады
          fields: []
        - name: Линии
          fields:
            - name: Цех
              type: enum
              enumValues:
                - Тара
                - Препарат
      registers:
        - name: Остатки
          dimensions:
            - name: Номенклатура
              catalog: Номенклатура
            - name: Склад
              catalog: Склады
      documents:
        - name: ПоступлениеСырья
          fields:
            - name: Номенклатура
              type: ref
              ref: Номенклатура
            - name: Склад
              type: ref
              ref: Склады
            - name: Количество
              type: number
          movements:
            - register: Остатки
              direction: in
              qtyField: Количество
              dimensions:
                - dimension: Номенклатура
                  field: Номенклатура
                - dimension: Склад
                  field: Склад
          guards: []
        - name: ЗаданиеНаТару
          fields:
            - name: ВидТары
              type: ref
              ref: Номенклатура
            - name: НомерПартии
              type: string
            - name: Объём
              type: number
            - name: Выпущена
              type: datetime
            - name: СкладТары
              type: ref
              ref: Склады
            - name: Сырьё
              type: ref
              ref: Номенклатура
            - name: СкладСырья
              type: ref
              ref: Склады
            - name: Линия
              type: ref
              ref: Линии
            - name: Стандарт
              type: enum
              enumValues:
                - РФ
                - GMP
          movements:
            - register: Остатки
              direction: in
              qtyField: Объём
              dimensions:
                - dimension: Номенклатура
                  field: ВидТары
                - dimension: Склад
                  field: СкладТары
            - register: Остатки
              direction: out
              qtyField: Объём
              dimensions:
                - dimension: Номенклатура
                  field: Сырьё
                - dimension: Склад
                  field: СкладСырья
          guards: []
        - name: ЗаданиеНаПрепарат
          fields:
            - name: Препарат
              type: ref
              ref: Номенклатура
            - name: Сырьё
              type: ref
              ref: Номенклатура
            - name: СкладСырья
              type: ref
              ref: Склады
            - name: НомерПартии
              type: string
            - name: Стандарт
              type: enum
              enumValues:
                - РФ
                - GMP
            - name: Объём
              type: number
            - name: Линия
              type: ref
              ref: Линии
            - name: Начато
              type: datetime
          movements:
            - register: Остатки
              direction: out
              qtyField: Объём
              dimensions:
                - dimension: Номенклатура
                  field: Сырьё
                - dimension: Склад
                  field: СкладСырья
          guards: []
        - name: КонтрольКачества
          fields:
            - name: НомерПартии
              type: string
            - name: Стандарт
              type: enum
              enumValues:
                - РФ
                - GMP
            - name: ЧислоПроб
              type: number
            - name: Статус
              type: enum
              enumValues:
                - исследования
                - качество подтверждено
                - необходим дозабор
                - брак
          movements: []
          guards:
            - kind: probe-count
              standardField: Стандарт
              countField: ЧислоПроб
              rules:
                - standard: РФ
                  count: 3
                - standard: GMP
                  count: 7
              message: Число проб не совпало со стандартом
        - name: Розлив
          fields:
            - name: НомерПартии
              type: string
            - name: НомерПартииТары
              type: string
            - name: Препарат
              type: ref
              ref: Номенклатура
            - name: Тара
              type: ref
              ref: Номенклатура
            - name: СкладТары
              type: ref
              ref: Склады
            - name: СкладГП
              type: ref
              ref: Склады
            - name: Количество
              type: number
            - name: Момент
              type: datetime
          movements:
            - register: Остатки
              direction: out
              qtyField: Количество
              dimensions:
                - dimension: Номенклатура
                  field: Тара
                - dimension: Склад
                  field: СкладТары
            - register: Остатки
              direction: in
              qtyField: Количество
              dimensions:
                - dimension: Номенклатура
                  field: Препарат
                - dimension: Склад
                  field: СкладГП
          guards:
            - kind: linked-status
              linkField: НомерПартии
              document: КонтрольКачества
              keyField: НомерПартии
              statusField: Статус
              value: качество подтверждено
              message: Розлив только после подтверждения качества
            - kind: linked-min-minutes
              linkField: НомерПартииТары
              document: ЗаданиеНаТару
              keyField: НомерПартии
              timeField: Выпущена
              nowField: Момент
              minutes: 180
              message: Тара ещё не отлежалась
            - kind: linked-max-minutes
              linkField: НомерПартии
              document: ЗаданиеНаПрепарат
              keyField: НомерПартии
              timeField: Начато
              nowField: Момент
              minutes: 360
              message: Препарат окислился, нужен аварийный слив
        - name: АварийныйСлив
          fields:
            - name: НомерПартии
              type: string
            - name: Препарат
              type: ref
              ref: Номенклатура
            - name: Момент
              type: datetime
          movements: []
          guards:
            - kind: linked-min-minutes
              linkField: НомерПартии
              document: ЗаданиеНаПрепарат
              keyField: НомерПартии
              timeField: Начато
              nowField: Момент
              minutes: 360
              message: До окисления слив не нужен
      items:
        - catalog: Номенклатура
          name: Полимер
          values:
            Вид: Сырьё
        - catalog: Номенклатура
          name: Картридж
          values:
            Вид: Тара
        - catalog: Номенклатура
          name: Инсулин
          values:
            Вид: Препарат
        - catalog: Склады
          name: Склад сырья
          values: {}
        - catalog: Склады
          name: Склад тары
          values: {}
        - catalog: Склады
          name: Склад ГП
          values: {}
        - catalog: Линии
          name: Линия тары
          values:
            Цех: Тара
        - catalog: Линии
          name: Линия препарата
          values:
            Цех: Препарат
      docs:
        - document: ПоступлениеСырья
          posted: true
          values:
            Номенклатура: Полимер
            Склад: Склад сырья
            Количество: 500
    steps:
      - id: open-tara
        title: Откройте задание на тару
        coach: Раздел «Предприятие», документ ЗаданиеНаТару.
        focus: object-list
        expect:
          - kind: list
            object: ЗаданиеНаТару
      - id: post-tara
        title: Проведите 100 картриджей
        coach: Вид тары Картридж, партия T-14, объём 100, выпуск 3 июня 2024 в 08:00.
        focus: post
        expect:
          - kind: posted
            document: ЗаданиеНаТару
            values: &a1
              ВидТары: Картридж
              НомерПартии: T-14
              Объём: 100
              Выпущена: 2024-06-03T08:00
              СкладТары: Склад тары
              Сырьё: Полимер
              СкладСырья: Склад сырья
              Линия: Линия тары
              Стандарт: РФ
    goal:
      - kind: posted
        document: ЗаданиеНаТару
        values: *a1
