              Тара: Картридж
              СкладТары: Склад тары
              СкладГП: Склад ГП
              Количество: 80
              Момент: 2024-06-03T12:00
    goal:
      - kind: balance
        register: Остатки
        dims:
          - name: Номенклатура
            value: Полимер
          - name: Склад
            value: Склад сырья
        qty: 320
      - kind: balance
        register: Остатки
        dims:
          - name: Номенклатура
            value: Картридж
          - name: Склад
            value: Склад тары
