      - Проведение списывает полимер и приходует картриджи одним объёмом.
  - type: onec-designer
    mode: hybrid
    id: batch-fill
    concept: batch
    difficulty: 4
    prompt: "Проведите удачную партию. Тара T-14 на 100 в 08:00. Препарат P-14 на 80 в 09:00, стандарт РФ. Контроль P-14: 3
      пробы и статус «качество подтверждено». Розлив 80 в 12:00 на склад ГП. В итоге полимера 320, картриджей 20,
      инсулина 80."
    seed: *a2
    steps:
      - id: posted-tara
        title: Тара T-14
        coach: 100 картриджей в 08:00, расход полимера тот же.
        focus: post
        expect:
          - kind: posted
            document: ЗаданиеНаТару
            values: *a1
      - id: posted-drug
        title: Смесь P-14
        coach: 80 полимера в 09:00, стандарт РФ, линия препарата.
        focus: post
        expect:
          - kind: posted
            document: ЗаданиеНаПрепарат
            values:
              Препарат: Инсулин
              Сырьё: Полимер
              СкладСырья: Склад сырья
              НомерПартии: P-14
              Стандарт: РФ
              Объём: 80
              Линия: Линия препарата
              Начато: 2024-06-03T09:00
      - id: posted-qc
        title: Три пробы
        coach: Контроль P-14, стандарт РФ, 3 пробы, статус «качество подтверждено».
        focus: post
        expect:
          - kind: posted
            document: КонтрольКачества
            values:
              НомерПартии: P-14
              Стандарт: РФ
              ЧислоПроб: 3
              Статус: качество подтверждено
      - id: posted-fill
        title: Розлив в 12:00
        coach: 80 единиц. Номер партии P-14, номер партии тары T-14.
        focus: post
        expect:
