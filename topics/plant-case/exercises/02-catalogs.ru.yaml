exercises:
  - id: catalogs-names
    concept: catalogs
    type: theory-quiz
    difficulty: 1
    prompt: Какие справочники нужны заводу в этом конструкторе?
    choices:
      - id: a
        text: Номенклатура, склады и линии с видом и цехом.
      - id: b
        text: Один справочник товаров и отдельное поле цены.
      - id: c
        text: Контрагенты, договоры и банковские счета.
      - id: d
        text: План счетов и субконто по каждому складу.
    correct:
      - a
    explanation: Номенклатура несёт вид, линии несут цех, склады различаются наименованием.
  - type: onec-designer
    mode: hybrid
    id: catalogs-shape
    concept: catalogs
    difficulty: 2
    prompt: "В конструкторе создайте справочники Номенклатура, Склады и Линии. У номенклатуры реквизит Вид: Сырьё, Тара,
      Препарат. У линий реквизит Цех: Тара, Препарат. У складов своих реквизитов нет."
    seed:
      today: 2024-06-03
    steps:
      - id: three-catalogs
        title: Три справочника
        coach: Кнопка «Справочник» и имя объекта. Нужны Номенклатура, Склады и Линии.
        focus: add-catalog
        expect:
          - kind: has-catalog
            name: Номенклатура
          - kind: has-catalog
            name: Склады
          - kind: has-catalog
            name: Линии
      - id: kind-field
        title: Вид номенклатуры
        coach: "Реквизит Вид у Номенклатуры, тип «перечисление»: Сырьё, Тара, Препарат."
        focus: add-field
        expect:
          - kind: has-field
            object: Номенклатура
            name: Вид
            type: enum
      - id: shop-field
        title: Цех линии
        coach: Реквизит Цех у Линий, перечисление Тара и Препарат.
        focus: add-field
        expect:
          - kind: has-field
            object: Линии
            name: Цех
            type: enum
    goal:
      - kind: has-catalog
        name: Номенклатура
      - kind: has-catalog
        name: Склады
      - kind: has-catalog
        name: Линии
      - kind: has-field
        object: Номенклатура
        name: Вид
        type: enum
      - kind: has-field
        object: Линии
        name: Цех
        type: enum
    solution:
      - op: add-catalog
        name: Номенклатура
      - op: add-catalog
        name: Склады
      - op: add-catalog
        name: Линии
      - op: add-field
        object: Номенклатура
        name: Вид
        type: enum
        enumValues:
          - Сырьё
          - Тара
          - Препарат
      - op: add-field
        object: Линии
        name: Цех
        type: enum
        enumValues:
          - Тара
          - Препарат
    hints:
      - Имя справочника вводится отдельно, кнопка «Справочник» только создаёт пустой объект.
      - "Значения перечисления пишутся через запятую: для вида это сырьё, тара и препарат."
  - type: onec-designer
    mode: hybrid
    id: catalogs-items
    concept: catalogs
    difficulty: 3
    prompt: "Справочники уже есть. Запишите элементы: Полимер (Сырьё), Картридж (Тара), Инсулин (Препарат), склады «Склад
      сырья», «Склад тары», «Склад ГП», линии «Линия тары» (цех Тара) и «Линия препарата» (цех Препарат)."
    seed:
      today: 2024-06-03
      catalogs:
        - name: Номенклатура
          fields:
            - name: Вид
              type: enum
              enumValues:
                - Сырьё
                - Тара
                - Препарат
        - name: Склады
          fields: []
        - name: Линии
          fields:
            - name: Цех
              type: enum
              enumValues:
                - Тара
                - Препарат
    steps:
      - id: item-polymer
        title: Полимер
        coach: Откройте «Номенклатура», создайте «Полимер» и запишите карточку.
        focus: post
        expect:
          - kind: item
            catalog: Номенклатура
            name: Полимер
            values: &a1
              Вид: Сырьё
      - id: item-cartridge
        title: Картридж
        coach: Откройте «Номенклатура», создайте «Картридж» и запишите карточку.
        focus: post
        expect:
          - kind: item
            catalog: Номенклатура
            name: Картридж
            values: &a2
              Вид: Тара
      - id: item-insulin
        title: Инсулин
        coach: Откройте «Номенклатура», создайте «Инсулин» и запишите карточку.
        focus: post
        expect:
          - kind: item
            catalog: Номенклатура
            name: Инсулин
            values: &a3
              Вид: Препарат
      - id: item-raw-warehouse
        title: Склад сырья
        coach: Откройте «Склады», создайте «Склад сырья» и запишите карточку.
        focus: post
        expect:
          - kind: item
            catalog: Склады
            name: Склад сырья
            values: &a4 {}
      - id: item-tara-warehouse
        title: Склад тары
        coach: Откройте «Склады», создайте «Склад тары» и запишите карточку.
        focus: post
        expect:
          - kind: item
            catalog: Склады
            name: Склад тары
            values: &a5 {}
      - id: item-fg-warehouse
        title: Склад ГП
        coach: Откройте «Склады», создайте «Склад ГП» и запишите карточку.
        focus: post
        expect:
          - kind: item
            catalog: Склады
            name: Склад ГП
            values: &a6 {}
      - id: item-tara-line
        title: Линия тары
        coach: Откройте «Линии», создайте «Линия тары» и запишите карточку.
        focus: post
        expect:
          - kind: item
            catalog: Линии
            name: Линия тары
            values: &a7
              Цех: Тара
      - id: item-drug-line
        title: Линия препарата
        coach: Откройте «Линии», создайте «Линия препарата» и запишите карточку.
        focus: post
        expect:
          - kind: item
            catalog: Линии
            name: Линия препарата
            values: &a8
              Цех: Препарат
    goal:
      - kind: item
        catalog: Номенклатура
        name: Полимер
        values: *a1
      - kind: item
        catalog: Номенклатура
        name: Картридж
        values: *a2
      - kind: item
        catalog: Номенклатура
        name: Инсулин
        values: *a3
      - kind: item
        catalog: Склады
        name: Склад сырья
        values: *a4
      - kind: item
        catalog: Склады
        name: Склад тары
        values: *a5
      - kind: item
        catalog: Склады
        name: Склад ГП
        values: *a6
      - kind: item
        catalog: Линии
        name: Линия тары
        values: *a7
      - kind: item
        catalog: Линии
        name: Линия препарата
        values: *a8
    solution:
      - op: open-mode
        mode: enterprise
      - op: open-object
        name: Номенклатура
      - op: open-new
        object: Номенклатура
      - op: set-value
        field: Наименование
        value: Полимер
      - op: set-value
        field: Вид
        value: Сырьё
      - op: save
      - op: open-mode
        mode: enterprise
      - op: open-object
        name: Номенклатура
      - op: open-new
        object: Номенклатура
      - op: set-value
        field: Наименование
        value: Картридж
      - op: set-value
        field: Вид
        value: Тара
      - op: save
      - op: open-mode
        mode: enterprise
      - op: open-object
        name: Номенклатура
      - op: open-new
        object: Номенклатура
      - op: set-value
        field: Наименование
        value: Инсулин
      - op: set-value
        field: Вид
        value: Препарат
      - op: save
      - op: open-mode
        mode: enterprise
      - op: open-object
        name: Склады
      - op: open-new
        object: Склады
      - op: set-value
        field: Наименование
        value: Склад сырья
      - op: save
      - op: open-mode
        mode: enterprise
      - op: open-object
        name: Склады
      - op: open-new
        object: Склады
      - op: set-value
        field: Наименование
        value: Склад тары
      - op: save
      - op: open-mode
        mode: enterprise
      - op: open-object
        name: Склады
      - op: open-new
        object: Склады
      - op: set-value
        field: Наименование
        value: Склад ГП
      - op: save
      - op: open-mode
        mode: enterprise
      - op: open-object
        name: Линии
      - op: open-new
        object: Линии
      - op: set-value
        field: Наименование
        value: Линия тары
      - op: set-value
        field: Цех
        value: Тара
      - op: save
      - op: open-mode
        mode: enterprise
      - op: open-object
        name: Линии
      - op: open-new
        object: Линии
      - op: set-value
        field: Наименование
        value: Линия препарата
      - op: set-value
        field: Цех
        value: Препарат
      - op: save
    hints:
      - Наименование пишется в карточке, вид и цех выбираются из перечисления, а не набираются наугад.
      - Сначала номенклатура, потом три склада без лишних полей, затем две линии с цехом.
