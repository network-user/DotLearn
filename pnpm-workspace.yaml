packages:
  - apps/*
  - packages/*

# pnpm 11+ reads overrides here (package.json "pnpm" field is ignored).
overrides:
  esbuild: '>=0.28.1'
  multer: '>=2.4.0 <3'
  lodash: '>=4.18.1'
  qs: '>=6.15.2'
  undici: '>=7.29.1 <8'
  '@opentelemetry/core': '>=2.8.0'
  js-yaml: '>=4.3.2 <5'
  proxy-addr: '>=2.0.8 <3'
  seroval: '>=1.6.3 <2'
  seroval-plugins: '>=1.6.3 <2'
  'test-exclude>glob': '10.5.0'

# pnpm 11 blocks postinstall scripts unless approved (ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  esbuild: true
  '@scarf/scarf': true
